<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Video Creator</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #151b31;
    --text: #eef2ff;
    --muted: #a9b3d1;
    --accent: #6d5efc;
    --accent-2: #00d4ff;
    --border: #2a3355;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(circle at top left, #1a2350, var(--bg) 45%);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    padding: 20px;
  }
  .container { width: min(1000px, 100%); margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 8px; }
  .sub { text-align: center; color: var(--muted); margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    margin-bottom: 20px;
  }
  label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 6px; }
  input, textarea, select {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border);
    background: #0f1428; color: var(--text); font: inherit; outline: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(0,212,255,.12);
  }
  textarea { min-height: 100px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  button, .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 12px 20px; border-radius: 12px; border: none;
    cursor: pointer; font-weight: 700; font-size: 1rem;
    text-decoration: none; transition: transform .15s, opacity .15s;
  }
  button:hover, .btn:hover { transform: translateY(-1px); opacity: .95; }
  .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #07101f; }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  #status { margin-top: 14px; font-size: 0.95rem; color: #22c55e; min-height: 24px; }
  canvas { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--border); background: #000; display: block; }
  video { width: 100%; border-radius: 12px; margin-top: 12px; background: #000; }
  .hidden { display: none; }
  @media (max-width: 700px) {
    .row, .row-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Free AI Video Creator</h1>
  <p class="sub">Generates AI images and records them into a downloadable video. No login, no credits.</p>

  <div class="card">
    <div style="margin-bottom:16px">
      <label for="prompt">Video description</label>
      <textarea id="prompt" placeholder="Example: A futuristic city at sunset with flying cars, cinematic lighting">A futuristic city at sunset with flying cars, cinematic lighting</textarea>
    </div>

    <div class="row">
      <div>
        <label for="style">Style</label>
        <select id="style">
          <option>Cinematic</option>
          <option>Realistic</option>
          <option>Anime</option>
          <option>3D Render</option>
          <option>Cyberpunk</option>
          <option>Watercolor</option>
        </select>
      </div>
      <div>
        <label for="aspect">Aspect ratio</label>
        <select id="aspect">
          <option value="16:9">16:9 (YouTube)</option>
          <option value="9:16">9:16 (Shorts/Reels)</option>
          <option value="1:1">1:1 (Square)</option>
        </select>
      </div>
    </div>

    <div class="row-3">
      <div>
        <label for="scenes">Scenes</label>
        <select id="scenes">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div>
        <label for="duration">Seconds per scene</label>
        <select id="duration">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div>
        <label for="fps">FPS</label>
        <select id="fps">
          <option value="24">24</option>
          <option value="30" selected>30</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="generateBtn" type="button">Generate Video</button>
      <button class="btn-secondary" id="clearBtn" type="button">Clear</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <video id="video" controls class="hidden"></video>
    <div class="actions" id="downloadWrap" style="display:none">
      <a id="downloadLink" class="btn-primary" download="ai-video.webm" href="#">Download Video</a>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const promptEl = $("prompt");
  const styleEl = $("style");
  const aspectEl = $("aspect");
  const scenesEl = $("scenes");
  const durationEl = $("duration");
  const fpsEl = $("fps");
  const generateBtn = $("generateBtn");
  const clearBtn = $("clearBtn");
  const statusEl = $("status");
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d");
  const video = $("video");
  const downloadWrap = $("downloadWrap");
  const downloadLink = $("downloadLink");

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.style.color = isError ? "#ff7a7a" : "#22c55e";
  }

  function getDimensions(aspect) {
    if (aspect === "9:16") return { w: 720, h: 1280 };
    if (aspect === "1:1") return { w: 1024, h: 1024 };
    return { w: 1280, h: 720 };
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Image failed to load"));
      img.src = src;
    });
  }

  function animateImage(img, w, h, seconds, fps) {
    return new Promise((resolve) => {
      const totalFrames = Math.max(1, Math.round(seconds * fps));
      let frame = 0;
      const startScale = 1;
      const endScale = 1.12; // zoom in effect
      const panX = (Math.random() - 0.5) * 60;
      const panY = (Math.random() - 0.5) * 60;

      function draw() {
        const t = frame / totalFrames;
        const scale = startScale + (endScale - startScale) * t;
        const dw = w * scale;
        const dh = h * scale;
        const dx = (w - dw) / 2 + panX * t;
        const dy = (h - dh) / 2 + panY * t;
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, dx, dy, dw, dh);
        frame++;
        if (frame <= totalFrames) {
          requestAnimationFrame(draw);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(draw);
    });
  }

  async function generateVideo() {
    const basePrompt = promptEl.value.trim();
    if (!basePrompt) {
      setStatus("Please enter a video description.", true);
      promptEl.focus();
      return;
    }

    generateBtn.disabled = true;
    downloadWrap.style.display = "none";
    video.classList.add("hidden");
    setStatus("Preparing...");

    const style = styleEl.value;
    const aspect = aspectEl.value;
    const scenes = parseInt(scenesEl.value, 10);
    const duration = parseFloat(durationEl.value);
    const fps = parseInt(fpsEl.value, 10);
    const { w, h } = getDimensions(aspect);

    canvas.width = w;
    canvas.height = h;

    const stream = canvas.captureStream(fps);
    let mimeType = "video/webm;codecs=vp9";
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = "video/webm";
    }

    const recorder = new MediaRecorder(stream, { mimeType });
    const chunks = [];
    recorder.ondataavailable = (e) => {
      if (e.data.size > 0) chunks.push(e.data);
    };

    const recordedBlob = new Promise((resolve) => {
      recorder.onstop = () => resolve(new Blob(chunks, { type: "video/webm" }));
    });

    recorder.start();

    try {
      for (let i = 0; i < scenes; i++) {
        setStatus(`Generating scene ${i + 1} of ${scenes}...`);
        const seed = Math.floor(Math.random() * 1000000);
        const fullPrompt = `${basePrompt}, ${style} style, scene ${i + 1}`;
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=${w}&height=${h}&nologo=true&seed=${seed}`;
        const img = await loadImage(url);
        setStatus(`Recording scene ${i + 1} of ${scenes}...`);
        await animateImage(img, w, h, duration, fps);
      }

      recorder.stop();
      const blob = await recordedBlob;
      const url = URL.createObjectURL(blob);
      video.src = url;
      video.classList.remove("hidden");
      downloadLink.href = url;
      downloadLink.download = `ai-video-${Date.now()}.webm`;
      downloadWrap.style.display = "flex";
      setStatus("Video generated successfully! Scroll down to preview and download.");
    } catch (err) {
      recorder.stop();
      console.error(err);
      setStatus("Error: " + err.message + ". Try again or use a shorter prompt.", true);
    } finally {
      generateBtn.disabled = false;
    }
  }

  generateBtn.addEventListener("click", generateVideo);

  clearBtn.addEventListener("click", () => {
    promptEl.value = "";
    video.classList.add("hidden");
    downloadWrap.style.display = "none";
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    setStatus("");
  });
})();
</script>
</body>
</html>
